<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; background:transparent; font-family:system-ui,sans-serif; overflow:hidden; }
  .toast { display:flex; align-items:center; gap:10px; margin:4px; padding:8px 14px;
    background:#2a3045; border:1px solid #444b66; border-radius:12px; color:#d9925e;
    box-shadow:0 4px 12px #0008; animation:entra .25s ease-out; }
  .toast img { width:40px; height:40px; object-fit:contain; }
  .toast span { font-size:28px; font-weight:700; }
  @keyframes entra { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
  <div class="toast"><img src="/vintem.png" alt=""><span id="v"></span></div>
<script>
  const n = Number(new URLSearchParams(location.search).get("v")) || 0;
  document.getElementById("v").textContent = "+" + n.toLocaleString("pt-BR");
</script>
</body>
</html>
