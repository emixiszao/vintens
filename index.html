<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinténs</title>
<style>
  :root { --bg:#1e2231; --card:#2a3045; --text:#e8e6f0; --muted:#9aa0b8; --gold:#d9925e; --add:#3f8f5a; --sub:#a64848; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  .moeda { text-align:center; }
  .moeda img { width:84px; height:84px; object-fit:contain; filter:drop-shadow(0 3px 6px #0008); }
  .nome { margin-top:4px; font-size:13px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); }
  .valor { font-size:44px; font-weight:700; color:var(--gold); line-height:1.1; }
  #gm { display:none; margin-top:14px; }
  .grupo { background:var(--card); border-radius:10px; padding:10px; margin-bottom:10px; }
  .grupo h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
  .botoes { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  button { border:0; border-radius:6px; padding:8px 0; font-size:13px; font-weight:600; color:#fff; cursor:pointer; }
  button:hover { filter:brightness(1.15); }
  button:active { transform:scale(.96); }
  .add button { background:var(--add); }
  .sub button { background:var(--sub); }
  .custom { display:flex; gap:6px; }
  .custom input { flex:1; min-width:0; padding:8px; border-radius:6px; border:1px solid #444b66; background:var(--bg); color:var(--text); }
  .custom button { padding:8px 12px; }
  .custom .m { background:var(--sub); } .custom .p { background:var(--add); }
</style>
</head>

" alt="Vintém">
    <div class="nome">Vinténs</div>
    <div class="valor" id="valor">0</div>
  </div>

  <div id="gm">
    <div class="grupo add"><h3>Adicionar</h3>
      <div class="botoes">
        <button data-d="10">+10</button><button data-d="50">+50</button><button data-d="100">+100</button>
        <button data-d="500">+500</button><button data-d="1000">+1000</button>
      </div>
    </div>
    <div class="grupo sub"><h3>Remover</h3>
      <div class="botoes">
        <button data-d="-10">−10</button><button data-d="-50">−50</button><button data-d="-100">−100</button>
        <button data-d="-500">−500</button><button data-d="-1000">−1000</button>
      </div>
    </div>
    <div class="grupo"><h3>Valor personalizado</h3>
      <div class="custom">
        <input id="custom" type="number" min="1" placeholder="Ex: 35">
        <button class="m" id="cm">−</button><button class="p" id="cp">+</button>
      </div>
    </div>
  </div>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

const KEY = "com.vintens.dinheiro/dados";
const CANAL_GANHO = "com.vintens.dinheiro/ganho";
const valorEl = document.getElementById("valor");
const gmEl = document.getElementById("gm");

const fmt = n => n.toLocaleString("pt-BR");
const ler = meta => Number(meta?.[KEY]?.amount ?? 0);

async function mudar(delta) {
  if (!delta) return;
  const meta = await OBR.room.getMetadata();
  const novo = Math.max(0, ler(meta) + delta);
  await OBR.room.setMetadata({ [KEY]: { amount: novo } });
  // Avisa todos (inclusive o GM) para tocar o som e mostrar o aviso no canto
  if (delta > 0) {
    await OBR.broadcast.sendMessage(CANAL_GANHO, { amount: delta }, { destination: "ALL" });
  }
}

function aplicarPapel(role) {
  const gm = role === "GM";
  gmEl.style.display = gm ? "block" : "none";
  OBR.action.setHeight(gm ? 420 : 190);
}

OBR.onReady(async () => {
  valorEl.textContent = fmt(ler(await OBR.room.getMetadata()));
  OBR.room.onMetadataChange(meta => { valorEl.textContent = fmt(ler(meta)); });

  aplicarPapel(await OBR.player.getRole());
  OBR.player.onChange(p => aplicarPapel(p.role));

  gmEl.querySelectorAll("button[data-d]").forEach(b =>
    b.addEventListener("click", () => mudar(Number(b.dataset.d))));

  const input = document.getElementById("custom");
  const valorCustom = () => Math.abs(parseInt(input.value, 10)) || 0;
  document.getElementById("cp").onclick = () => { mudar(valorCustom()); input.value = ""; };
  document.getElementById("cm").onclick = () => { mudar(-valorCustom()); input.value = ""; };
});
</script>
</body>
</html>
